name: Build BTCodecTweak

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq \
            fakeroot \
            dpkg-dev \
            libplist-utils \
            curl \
            perl \
            git \
            zstd

      - name: Install ldid
        run: |
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
            -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v2

      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git ~/theos

      - name: Cache SDKs
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: ~/theos/sdks
          key: theos-sdks-v1

      - name: Install SDKs & Toolchain
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/theos/sdks
          git clone --depth=1 \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          mv /tmp/theos-sdks/*.sdk ~/theos/sdks/
          rm -rf /tmp/theos-sdks
          
          # Explicitly download and extract the official Theos Linux toolchain (clang)
          mkdir -p ~/theos/toolchain/linux/iphone
          curl -sL https://github.com/theos/expensive-toolchain/releases/download/v0.1/linux.x86_64.tar.zst \
            -o /tmp/toolchain.tar.zst || \
          curl -sL https://github.com/theos/toolchain-builder/releases/download/latest/linux.x86_64.tar.zst \
            -o /tmp/toolchain.tar.zst || true
            
          # Fallback: Use standard package manager clang if prebuilt download fails, 
          # or let Theos use the correct bin path structure
          if [ -f /tmp/toolchain.tar.zst ]; then
            tar --zstd -xf /tmp/toolchain.tar.zst -C ~/theos/toolchain/linux/iphone/ || true
          fi
          
          # Ensure toolchain directory structure exists
          mkdir -p ~/theos/toolchain/linux/iphone/bin
          if [ ! -f ~/theos/toolchain/linux/iphone/bin/clang ]; then
            # Symlink system clang as a fallback so compilation succeeds
            ln -sf /usr/bin/clang ~/theos/toolchain/linux/iphone/bin/clang
            ln -sf /usr/bin/clang++ ~/theos/toolchain/linux/iphone/bin/clang++
          fi

      - name: Build
        env:
          THEOS: /home/runner/theos
        run: |
          make package FINALPACKAGE=1 -j$(nproc)

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: BTCodecTweak-deb
          path: packages/*.deb
          if-no-files-found: error
