name: Build BTCodecTweak

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ldid
        run: |
          brew install ldid

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Tweak
        env:
          THEOS: /Users/runner/theos
        run: |
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: BTCodecTweak-deb
          path: packages/*.deb
          if-no-files-found: error
