name: Build BTCodecTweak

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (dpkg & ldid)
        run: |
          brew install ldid dpkg

      - name: Setup Theos & SDK
        uses: theos/actions/setup@main
        with:
          sdk: 'iPhoneOS16.5'

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: BTCodecTweak-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: error
