name: Build BTCodecTweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # theos/actions/setup downloads Theos + an iPhoneOS SDK whose
      # sdks/iPhoneOSXX.X.sdk/System/Library/PrivateFrameworks/ directory
      # contains stub TBDs for Preferences, BackBoardServices, etc.
      # This eliminates both the "search path not found" warning and the
      # "framework not found" error — even though our Makefile no longer
      # links Preferences explicitly, having the stubs prevents future
      # surprises if a new target ever needs a private framework.
      - name: Setup Theos
        uses: theos/actions/setup@main
        with:
          sdk: 'iPhoneOS16.5'   # pinned — has PrivateFrameworks stubs

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: BTCodecTweak-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: error
